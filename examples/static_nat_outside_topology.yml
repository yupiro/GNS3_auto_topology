      1. PC1 -> 192.168.1.50
         (outside static NAT経由)
         でEXT-SVRへ到達確認
      2. PC1 -> 203.0.113.50
         (実アドレス)でも到達確認
      3. R1で show ip nat
         translations / statistics

  - x: -300
    y: 250
    text: |
      PC1
      192.168.1.10

  - x: -140
    y: 20
    text: |
      R1 Gi0/0 (inside)
      192.168.1.1

  - x: 0
